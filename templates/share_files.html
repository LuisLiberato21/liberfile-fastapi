<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir Archivos</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; 
        }
        
        /* Barra de navegación */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .navbar img {
            width: 80px;
        }
        
        .navbar a {
            color: #fff;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .navbar a:hover {
            background-color: #555;
        }
        
        .navbar a.logout {
            color: #ff4d4d;
            font-weight: bold;
        }
        
        /* Contenido principal */
        .main-content {
            padding: 20px;
            flex: 1;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        
        h1 {
            text-align: center;
            color: #333;
        }
        
        .file-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .file-actions button {
            padding: 10px 15px;
            border: none;
            background-color: #28a745;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .file-actions button:hover {
            background-color: #218838;
        }

        .file-list {
            margin-bottom: 20px;
        }
        
        .file-list div {
            padding: 10px;
            background-color: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .file-list div:hover {
            background-color: #e9ecef;
        }

        .user-selection {
            margin-bottom: 20px;
        }

        .permissions {
            margin-bottom: 20px;
        }

        .permissions label {
            display: block;
            margin-bottom: 5px;
        }

        /* Espaciado entre botones */
        .file-actions button + button {
            margin-left: 10px; /* Agrega margen entre los botones */
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <div class="navbar">
        <img src="/static/logo.png" alt="Logo">
        <div>
            <a href="/file-manager">Gestor</a>
            <a href="/users">Usuarios</a>
            <a href="/share-files">Compartir Archivos</a>
            <a href="/admin-user">Administración de Usuario</a>
            <a href="/logout" class="logout" onclick="logout()">Cerrar sesión</a>
        </div>
    </div>
    
    <!-- Contenido principal -->
    <div class="main-content">
        <div class="container">
            <h1>Compartir Archivos</h1>
            
            <div class="file-actions">
                <button onclick="shareFile()">Compartir archivo</button>
                <button onclick="viewSharedFiles()">Ver archivos compartidos</button>
            </div>

            <div class="file-list">
                <h3>Tus archivos (selecciona uno para compartir):</h3>
                <div id="fileList"><p style="color:#888;">Cargando...</p></div>
            </div>

            <div class="user-selection">
                <h3>Selecciona destinatario:</h3>
                <select id="recipient"></select>
            </div>

            <div class="permissions">
                <h3>Establecer permisos:</h3>
                <label>
                    <input type="radio" name="permissions" value="lectura" checked>
                    Solo lectura
                </label>
                <label>
                    <input type="radio" name="permissions" value="edicion">
                    Edición
                </label>
            </div>

            <div id="sharedList" style="display:none; margin-top:20px;">
                <h3>Archivos compartidos conmigo:</h3>
                <div id="sharedListContent"></div>
            </div>
        </div>
    </div>

    <script>
        const currentUser = "{{ current_user }}";
        let selectedFileId = "";
        let selectedFileName = "";

        function logout() {
            // Redirigir al módulo de inicio de sesión
            window.location.href = '/logout';
        }

        function selectFile(fileId, fileName, el) {
            selectedFileId = fileId;
            selectedFileName = fileName;
            document.querySelectorAll('.file-list .file').forEach(d => d.style.backgroundColor = "");
            el.style.backgroundColor = "#d4edda";
        }

        async function cargarMisArchivos() {
            const contenedor = document.getElementById("fileList");
            const response = await fetch("/api/files?mine=true");
            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }
            const archivos = await response.json();

            if (archivos.length === 0) {
                contenedor.innerHTML = '<p style="color:#888;">Todavía no has subido ningún archivo (hazlo desde el Gestor).</p>';
                return;
            }

            contenedor.innerHTML = "";
            archivos.forEach(archivo => {
                const div = document.createElement("div");
                div.className = "file";
                div.textContent = archivo.filename;
                div.onclick = () => selectFile(archivo.file_id, archivo.filename, div);
                contenedor.appendChild(div);
            });
        }

        async function cargarUsuarios() {
            const select = document.getElementById("recipient");
            const response = await fetch("/api/usuarios");
            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }
            const usuarios = await response.json();

            select.innerHTML = "";
            usuarios
                .filter(u => u.usuario && u.usuario !== currentUser)
                .forEach(u => {
                    const option = document.createElement("option");
                    option.value = u.usuario;
                    option.textContent = `${u.nombres} ${u.apellidos} (${u.usuario})`;
                    select.appendChild(option);
                });

            if (select.options.length === 0) {
                select.innerHTML = '<option value="">No hay otros usuarios registrados</option>';
            }
        }

        async function shareFile() {
            if (!selectedFileId) {
                alert("Por favor, selecciona un archivo para compartir.");
                return;
            }
            const recipient = document.getElementById("recipient").value;
            if (!recipient) {
                alert("No hay un destinatario válido seleccionado.");
                return;
            }
            const permission = document.querySelector('input[name="permissions"]:checked').value;

            const response = await fetch("/api/share", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ file_id: selectedFileId, destinatario: recipient, permiso: permission }),
            });
            const data = await response.json();

            if (response.ok) {
                alert(data.mensaje);
            } else {
                alert(data.detail || "No se pudo compartir el archivo.");
            }
        }

        async function viewSharedFiles() {
            const panel = document.getElementById("sharedList");
            const contenido = document.getElementById("sharedListContent");

            if (panel.style.display === "none") {
                const response = await fetch("/api/shared-with-me");
                const compartidos = await response.json();

                contenido.innerHTML = compartidos.length === 0
                    ? '<p style="color:#888;">Nadie ha compartido archivos contigo todavía.</p>'
                    : "";

                compartidos.forEach(c => {
                    const div = document.createElement("div");
                    div.className = "file";
                    div.style.cursor = "default";
                    div.innerHTML = `<strong>${c.filename}</strong> — compartido por ${c.propietario} `
                        + `(${c.permiso === "lectura" ? "solo lectura" : "edición"})`;
                    contenido.appendChild(div);
                });
                panel.style.display = "block";
            } else {
                panel.style.display = "none";
            }
        }

        window.onload = () => {
            cargarMisArchivos();
            cargarUsuarios();
        };
    </script>
</body>
</html>
